<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omnia AEO - White-Label Answer Engine Optimization Platform</title>
    <meta name="description" content="Multi-agent Answer Engine Optimization (AEO) platform for agencies delivering AI visibility across ChatGPT, Perplexity, Gemini, and Google AI Overviews in German, Japanese, Portuguese, and Spanish." />
    <meta property="og:title" content="Omnia AEO - White-Label Answer Engine Optimization Platform" />
    <meta property="og:description" content="Multi-agent Answer Engine Optimization (AEO) platform for agencies delivering AI visibility across ChatGPT, Perplexity, Gemini, and Google AI Overviews in German, Japanese, Portuguese, and Spanish." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('omnia_aeo_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fbfbfd] dark:bg-[#000000] text-[#1d1d1f] dark:text-[#f5f5f7] antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
